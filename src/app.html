<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="utf-8" />
    <meta name="description" content="Nicola Preda Portfolio" />
    <link rel="icon" href="%svelte.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--Meta Settings-->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://nicolapreda.me/">
    <meta property="og:title" content="Nicola Preda">
    <meta property="og:image" content="%svelte.assets%/favicon.png">
    <meta property="og:description" content="Nicola Preda portfolio website">
    <meta name=description content="Nicola Preda portfolio website">

    <link href="%svelte.assets%/output.css" rel="stylesheet">

    <meta property="og:locale" content="en_EN">

    <!--Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <!--Figtree-->
        <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@600;700;900&display=swap" rel="stylesheet"> 
        <!--Poppins-->
        <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@600;700;900&family=Poppins:wght@600&display=swap" rel="stylesheet"> 

    <!--Analytics-->
    <script async src="https://cdn.splitbee.io/sb.js"></script>
    <script>
        // On page load or when changing themes, best to add inline in `head` to avoid FOUC
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark')
        }
    </script>
    <title>Nicola Preda</title>
    %svelte.head%
</head>

<body>

    <div>%svelte.body%</div>

</body>

</html>
